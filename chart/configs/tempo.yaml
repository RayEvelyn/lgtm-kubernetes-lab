# Tempo 3 monolithic live-store path, no Kafka and no legacy ingester block.
stream_over_http_enabled: true
server:
  http_listen_port: 3200
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318
live_store:
  wal:
    path: /data/live-store/wal
  shutdown_marker_dir: /data/live-store/shutdown-marker
  max_trace_idle: 10s
  max_block_duration: 5m
  max_block_bytes: 1000000
backend_scheduler:
  local_work_path: /data/scheduler
  provider:
    compaction:
      compaction:
        block_retention: 24h
storage:
  trace:
    backend: local
    wal:
      path: /data/wal
    local:
      path: /data/blocks
    pool:
      max_workers: 10
      queue_depth: 100
usage_report:
  reporting_enabled: false
