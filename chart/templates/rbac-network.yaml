apiVersion: v1
kind: ServiceAccount
metadata:
  name: alloy
  namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: alloy-read-logs
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: ['']
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ['']
    resources: [pods/log]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: alloy-read-logs
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: alloy
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: alloy-read-logs
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: private-lgtm-ingress
  namespace: {{ .Release.Namespace }}
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {}
    # Label an approved application namespace lgtm-client=true through its manifest repo.
    - from:
        - namespaceSelector:
            matchLabels:
              lgtm-client: 'true'
      ports:
        - {protocol: TCP, port: 4317}
        - {protocol: TCP, port: 4318}
