{{- range $name, $component := .Values.components }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-data
  namespace: {{ $.Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- if $.Values.storageClass }}
  storageClassName: {{ $.Values.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $component.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: {{ $name }}
  ports:
    - name: http
      port: {{ $component.port }}
      targetPort: http
    {{- if or (eq $name "tempo") (eq $name "alloy") }}
    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
    - name: otlp-http
      port: 4318
      targetPort: otlp-http
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
spec:
  replicas: 1
  # RWO filesystem storage: avoid two instances sharing one data directory.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/config: {{ if eq $name "alloy" }}{{ tpl ($.Files.Get "configs/alloy.alloy") $ | sha256sum }}{{ else if eq $name "grafana" }}{{ include (print $.Template.BasePath "/configmaps.yaml") $ | sha256sum }}{{ else }}{{ $.Files.Get (printf "configs/%s.yaml" $name) | sha256sum }}{{ end }}
    spec:
      automountServiceAccountToken: {{ eq $name "alloy" }}
      {{- if eq $name "alloy" }}
      serviceAccountName: alloy
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: {{ $component.uid }}
        runAsGroup: {{ $component.uid }}
        fsGroup: {{ $component.uid }}
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: {{ $name }}
          image: {{ $component.image | quote }}
          imagePullPolicy: IfNotPresent
          {{- if eq $name "alloy" }}
          args: [run, /etc/lgtm/config.alloy, --server.http.listen-addr=0.0.0.0:12345, --storage.path=/var/lib/alloy]
          {{- else if ne $name "grafana" }}
          args: [-target=all, -config.file=/etc/lgtm/config.yaml]
          {{- else }}
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef: {name: {{ $.Values.grafanaSecret }}, key: admin-user}
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ $.Values.grafanaSecret }}, key: admin-password}
            - name: GF_USERS_ALLOW_SIGN_UP
              value: 'false'
            - name: GF_AUTH_ANONYMOUS_ENABLED
              value: 'false'
            - name: GF_ANALYTICS_REPORTING_ENABLED
              value: 'false'
            - name: GF_METRICS_ENABLED
              value: 'true'
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
{{ toYaml $component.resources | indent 12 }}
          ports:
            - name: http
              containerPort: {{ $component.port }}
            {{- if or (eq $name "tempo") (eq $name "alloy") }}
            - name: otlp-grpc
              containerPort: 4317
            - name: otlp-http
              containerPort: 4318
            {{- end }}
          readinessProbe:
            httpGet:
              path: {{ if eq $name "grafana" }}/api/health{{ else if eq $name "alloy" }}/-/ready{{ else }}/ready{{ end }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          # Readiness reflects backend ring/bootstrap state; no aggressive liveness restart loop.
          volumeMounts:
            - name: data
              mountPath: {{ $component.dataPath }}
            {{- if eq $name "grafana" }}
            - name: config
              mountPath: /etc/grafana/provisioning/datasources
            {{- else }}
            - name: config
              mountPath: /etc/lgtm
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $name }}-data
        - name: config
          configMap:
            name: {{ if eq $name "grafana" }}grafana-datasources{{ else }}{{ $name }}-config{{ end }}
{{- end }}
